name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: mbstring, pdo, sqlite
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instala dependências PHP
        run: composer install --no-interaction --prefer-dist

      - name: Instala dependências Node
        run: npm install

      - name: Configura ambiente
        run: |
          cp .env.example .env
          php artisan key:generate